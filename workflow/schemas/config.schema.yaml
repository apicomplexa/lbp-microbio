$schema: "https://json-schema.org/draft/2020-12/schema"
description: Schema for config/config.yaml. Extend it whenever you add a config key.
type: object
properties:
  samples:
    type: string
    description: Path to the sample sheet (TSV), see samples.schema.yaml
  samples_no_batch:
    type: string
    description: Path to the temporal sample sheet (TSV) without batches labels
  samples_index_col:
    type: string
    default: Run
    description: Index column name of samples sheet
  batch_size:
    type: integer
    default: 100
    description: Default batch size. Will be recalculated if last batch less then 70% of default to avoid small last batch
  rand_seed:
    type: integer
    default: 8092003
    description: Seed for PRG
  pathvars:
    type: object
    description: Snakemake pathvars, used in rules as <name>
    additionalProperties:
      type: string
    required: [results, logs, temp, reports, figures]
  notify:
    type: object
    properties:
      telegram:
        type: boolean
        default: false
    default: {telegram: false}
  trimming:
    type: object
    properties:
      trunc_len_f:
        type: integer
        description: Target length of forward reads
      trunc_len_r:
        type: integer
        description: Target length of reverse reads
      max_ee_f:
        type: integer
        description: Per read error threshold for forward reads
      max_ee_r:
        type: integer
        description: Per read error threshold for reverse reads
  dada2:
    type: object
    properties:
      pooling:
        oneOf:
          - type: boolean
          - type: string
            enum: [pseudo]
        default: false
        description: Sample pooling for dada() - true, false or "pseudo"
required:
  - samples
  - samples_index_col
  - batch_size
  - rand_seed
  - pathvars
  - trimming
