# $schema: ../workflow/schemas/config.schema.yaml
# Analysis parameters — WHAT to analyse. Validated against
# workflow/schemas/config.schema.yaml; keys are described in config/README.md.
# HOW to run (cores, memory, conda, cluster) lives in workflow/profiles/.

samples: config/samples.tsv
samples_no_batch: config/samples_no_batch.tsv
samples_index_col: Run
batch_size: 20
rand_seed: 8092003

# Snakemake pathvars: write "<results>/x.tsv" in rules instead of hard-coding
# directories. Values may reference other pathvars.
pathvars:
  samples: data/samples
  temp: data/temp
  resources: resources
  results: results
  reports: <results>/reports
  figures: <results>/figures
  logs: logs

resources:
  silva_db: resources/SILVA_SSU_r138.2_v2.RData

notify:
  telegram: true # see workflow/rules/notify.smk

trimming:
  trunc_len_f: 230
  trunc_len_r: 230
  max_ee_f: 10
  max_ee_r: 10

dada2:
  pooling: true
